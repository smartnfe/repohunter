name: 🔄 Fetch Repos

on:
  schedule:
    - cron: '0 8 * * *'  # ทุกวัน 08:00 UTC
  workflow_dispatch:      # อนุญาตให้รันด้วยตัวเอง

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Fetch GitHub Repos
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'EOF'
          import json
          import urllib.request
          import os
          from datetime import datetime, timedelta
          
          token = os.environ['GITHUB_TOKEN']
          headers = {'Authorization': f'token {token}'}
          
          # Query templates for different categories
          queries = {
              'ai': 'topic:ai topic:ml topic:llm topic:gpt sort:stars created:>2025-09-01 per_page:20',
              'automation': 'topic:automation topic:workflow topic:rpa sort:stars created:>2025-09-01 per_page:15',
              'trading': 'topic:trading topic:finance topic:crypto sort:stars created:>2025-09-01 per_page:15',
              'tools': 'topic:developer-tools topic:cli topic:devops sort:stars created:>2025-09-01 per_page:15',
          }
          
          all_repos = []
          
          for category, query in queries.items():
              url = f'https://api.github.com/search/repositories?q={query}'
              req = urllib.request.Request(url, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      data = json.loads(response.read())
                      for repo in data.get('items', []):
                          all_repos.append({
                              'full_name': repo['full_name'],
                              'description': repo['description'] or 'ไม่มีคำอธิบาย',
                              'language': repo['language'] or '-',
                              'stargazers_count': repo['stargazers_count'],
                              'forks_count': repo['forks_count'],
                              'html_url': repo['html_url'],
                              'topics': repo.get('topics', []),
                              'category': category
                          })
                  print(f'✓ Fetched {len(data.get("items", []))} repos for {category}')
              except Exception as e:
                  print(f'✗ Error fetching {category}: {e}')
          
          # Also fetch trending (stars this week)
          trending_query = 'sort:stars created:>2025-09-21 per_page:10'
          url = f'https://api.github.com/search/repositories?q={trending_query}'
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  data = json.loads(response.read())
                  for repo in data.get('items', []):
                      # Add trending repos if not already in list
                      full_name = repo['full_name']
                      if not any(r['full_name'] == full_name for r in all_repos):
                          all_repos.append({
                              'full_name': full_name,
                              'description': repo['description'] or 'Trending repo',
                              'language': repo['language'] or '-',
                              'stargazers_count': repo['stargazers_count'],
                              'forks_count': repo['forks_count'],
                              'html_url': repo['html_url'],
                              'topics': ['trending'],
                              'category': 'automation'
                          })
                  print(f'✓ Fetched {len(data.get("items", []))} trending repos')
          except Exception as e:
              print(f'✗ Error fetching trending: {e}')
          
          # Write output
          output = {
              '_meta': {
                  'last_update': datetime.utcnow().strftime('%Y-%m-%d'),
                  'sources': ['github.com/search', 'github.com/trending'],
                  'total_repos': len(all_repos),
                  'next_fetch': (datetime.utcnow() + timedelta(days=1)).strftime('%Y-%m-%dT%H:%M:%SZ')
              },
              'repos': sorted(all_repos, key=lambda x: x['stargazers_count'], reverse=True)
          }
          
          with open('data/repos.json', 'w', encoding='utf-8') as f:
              json.dump(output, f, indent=2, ensure_ascii=False)
          
          print(f'✅ Wrote {len(all_repos)} repos to data/repos.json')
          EOF
      
      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "🔄 Update repos data - $(date -u +%Y-%m-%d)" || echo "No changes to commit"
          git push
