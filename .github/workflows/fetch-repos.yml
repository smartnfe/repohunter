name: 🔄 Fetch Repos

on:
  schedule:
    - cron: '0 8 * * *'  # ทุกวัน 08:00 UTC (15:00 น. ไทย)
  workflow_dispatch:      # กดรันเองได้จากแท็บ Actions

permissions:
  contents: write

concurrency:
  group: fetch-repos
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch repos + translate to Thai
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/fetch_repos.py

      - name: Commit & Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json data/curated.json
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "🔄 Update repos data - $(date -u +%Y-%m-%d)"
            git push
          fi
