<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RepoHunter - ล่าหา Repo น่าสนใจบน GitHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>🔍 RepoHunter</h1>
            <p>ค้นหาและรวบรวม repository น่าสนใจจาก GitHub</p>
            <div class="share-bar">
                <span class="share-label">แชร์หน้านี้:</span>
                <button class="share-btn share-fb" data-share="facebook" data-title="RepoHunter — ล่าหา Repo น่าสนใจบน GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.7-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.2c-1.2 0-1.6.8-1.6 1.6V12h2.7l-.4 2.9h-2.3v7A10 10 0 0 0 22 12z"/></svg>
                    Facebook
                </button>
                <button class="share-btn share-line" data-share="line" data-title="RepoHunter — ล่าหา Repo น่าสนใจบน GitHub">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.5 2 2 5.7 2 10.3c0 4.1 3.6 7.5 8.5 8.2.3.1.8.2.9.5.1.3.1.7 0 1l-.1.9c0 .3-.2 1 .9.5s5.8-3.4 7.7-5.8c1.4-1.5 2.1-3.1 2.1-5.3C22 5.7 17.5 2 12 2zM8.3 13.4H6.6c-.3 0-.5-.2-.5-.5V8.6c0-.3.2-.5.5-.5s.5.2.5.5v3.8h1.2c.3 0 .5.2.5.5s-.2.5-.5.5zm1.6-.5c0 .3-.2.5-.5.5s-.5-.2-.5-.5V8.6c0-.3.2-.5.5-.5s.5.2.5.5v4.3zm4.6 0c0 .2-.1.4-.3.5h-.2c-.1 0-.3-.1-.4-.2l-2-2.7v2.4c0 .3-.2.5-.5.5s-.5-.2-.5-.5V8.6c0-.2.1-.4.3-.5h.2c.2 0 .3.1.4.2l2 2.7V8.6c0-.3.2-.5.5-.5s.5.2.5.5v4.3zm3.4-3.2c.3 0 .5.2.5.5s-.2.5-.5.5h-1.2v1h1.2c.3 0 .5.2.5.5s-.2.5-.5.5h-1.7c-.3 0-.5-.2-.5-.5V8.6c0-.3.2-.5.5-.5h1.7c.3 0 .5.2.5.5s-.2.5-.5.5h-1.2v1h1.2z"/></svg>
                    LINE
                </button>
                <button class="share-btn share-copy" data-share="copy">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 13.5a3 3 0 0 0 4.2 0l3-3a3 3 0 0 0-4.2-4.2l-1 1M14.5 10.5a3 3 0 0 0-4.2 0l-3 3a3 3 0 0 0 4.2 4.2l1-1"/></svg>
                    คัดลอกลิงก์
                </button>
            </div>
        </div>
    </header>

    <main class="container">
        <!-- Search & Filter -->
        <section class="controls">
            <div class="search-box">
                <input type="text" id="search" placeholder="ค้นหาชื่อ repo...">
            </div>
            <div class="filters">
                <button class="filter-btn active" data-filter="all">ทั้งหมด</button>
                <button class="filter-btn" data-filter="ai">🤖 AI</button>
                <button class="filter-btn" data-filter="automation">⚡ Automation</button>
                <button class="filter-btn" data-filter="tool">🛠 Tools</button>
                <button class="filter-btn" data-filter="trading">📈 Trading</button>
            </div>
            <div class="sort-options">
                <label>เรียงตาม:</label>
                <select id="sort">
                    <option value="stars-desc">⭐ ดาว (มาก→น้อย)</option>
                    <option value="stars-asc">⭐ ดาว (น้อย→มาก)</option>
                    <option value="name-asc">🔤 ชื่อ (A-Z)</option>
                    <option value="name-desc">🔤 ชื่อ (Z-A)</option>
                </select>
            </div>
        </section>

        <!-- Stats -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-num" id="total-repos">0</span>
                <span class="stat-label">Repo ทั้งหมด</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" id="total-stars">0</span>
                <span class="stat-label">รวมดาว</span>
            </div>
            <div class="stat-card">
                <span class="stat-num" id="last-update">-</span>
                <span class="stat-label">อัปเดตล่าสุด</span>
            </div>
        </section>

        <!-- Repo Grid -->
        <section id="repo-grid" class="repo-grid">
            <!-- Cards loaded by JS -->
        </section>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state" style="display:none;">
            <p>😕 ไม่พบ repo ที่ตรงกับเงื่อนไข</p>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>RepoHunter &copy; 2025 | ข้อมูลจาก <a href="https://github.com" target="_blank">GitHub</a></p>
            <p>อัปเดตอัตโนมัติผ่าน GitHub Actions</p>
        </div>
    </footer>

    <script src="app.js"></script>
</body>
</html>
